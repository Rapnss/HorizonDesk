<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            color: white; 
            margin: 0; 
            background: linear-gradient(135deg, #10b981, #3b82f6);
            overflow: hidden;
        }
        .card { 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(20px); 
            padding: 60px; 
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.2); 
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        p { font-size: 1.2rem; opacity: 0.9; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Custom Tab Active! 🚀</h1>
        <p>This high-fidelity view is rendered directly from your plugin folder.</p>
        <div style="margin-top: 30px; font-weight: bold; background: rgba(0,0,0,0.2); padding: 10px 20px; border-radius: 100px; display: inline-block;">
            SDK v1.2.0 FEATURE VERIFIED
        </div>
    </div>
</body>
</html>
