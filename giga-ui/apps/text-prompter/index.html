<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Text Prompter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a18 0%, #1a0a28 40%, #2a0a30 100%);
            color: #e8e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(14, 14, 26, 0.8);
            border-bottom: 1px solid rgba(42, 42, 66, 0.5);
            -webkit-app-region: drag;
        }

        .header-icon {
            font-size: 22px;
            margin-right: 10px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
        }

        .header-badge {
            margin-left: 10px;
            padding: 2px 10px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            color: white;
            border-radius: 10px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
            }
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            background: linear-gradient(135deg, #c084fc 0%, #a78bfa 50%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            box-shadow: 0 20px 60px rgba(167, 139, 250, 0.3);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 20px 60px rgba(167, 139, 250, 0.3);
            }

            50% {
                box-shadow: 0 25px 80px rgba(167, 139, 250, 0.5);
            }
        }

        .title {
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 14px;
            color: #9a9ab8;
            margin-top: -20px;
        }

        .coming-soon {
            padding: 10px 28px;
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a78bfa;
        }

        /* Text Editor Mockup */
        .editor-preview {
            width: 460px;
            background: rgba(14, 14, 26, 0.6);
            border: 1px solid rgba(42, 42, 66, 0.5);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(20, 20, 40, 0.5);
            border-bottom: 1px solid rgba(42, 42, 66, 0.4);
        }

        .toolbar-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 30, 50, 0.5);
            border: 1px solid rgba(42, 42, 66, 0.4);
            border-radius: 6px;
            font-size: 12px;
            color: #9a9ab8;
            cursor: pointer;
        }

        .editor-body {
            padding: 16px 20px;
        }

        .editor-line {
            padding: 4px 0;
            font-size: 13px;
            line-height: 1.8;
            color: rgba(232, 232, 240, 0.7);
        }

        .editor-line .highlight {
            background: rgba(167, 139, 250, 0.15);
            color: #c084fc;
            padding: 1px 4px;
            border-radius: 3px;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: #a78bfa;
            vertical-align: middle;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .features {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }

        .feature-card {
            padding: 16px 20px;
            background: rgba(20, 20, 40, 0.6);
            border: 1px solid rgba(42, 42, 66, 0.5);
            border-radius: 14px;
            text-align: center;
            width: 140px;
            transition: all 0.3s;
        }

        .feature-card:hover {
            border-color: rgba(167, 139, 250, 0.3);
            transform: translateY(-4px);
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-name {
            font-size: 11px;
            font-weight: 600;
            color: #9a9ab8;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="header-icon">✍️</span>
        <span class="header-title">Horizon Text Prompter</span>
        <span class="header-badge">Coming Soon</span>
    </div>

    <div class="main">
        <div class="logo">✍️</div>
        <div class="title">Text Prompter</div>
        <div class="subtitle">AI-powered writing assistant and editor</div>
        <div class="coming-soon">✦ Coming Soon</div>

        <div class="editor-preview">
            <div class="editor-toolbar">
                <div class="toolbar-btn"><b>B</b></div>
                <div class="toolbar-btn"><i>I</i></div>
                <div class="toolbar-btn"><u>U</u></div>
                <div style="width:1px;height:18px;background:rgba(42,42,66,0.6)"></div>
                <div class="toolbar-btn">H1</div>
                <div class="toolbar-btn">H2</div>
                <div class="toolbar-btn">¶</div>
                <div style="flex:1"></div>
                <div class="toolbar-btn">🤖</div>
            </div>
            <div class="editor-body">
                <div class="editor-line">The future of <span class="highlight">intelligent writing</span> is here.</div>
                <div class="editor-line">Horizon Text Prompter combines the power of AI</div>
                <div class="editor-line">with a <span class="highlight">beautiful distraction-free</span> editor.</div>
                <div class="editor-line"><span class="cursor-blink"></span></div>
            </div>
        </div>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">🧠</div>
                <div class="feature-name">AI Writing</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📝</div>
                <div class="feature-name">Rich Editor</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🌐</div>
                <div class="feature-name">Multi-language</div>
            </div>
        </div>
    </div>
</body>

</html>
