<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Presentation Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a18 0%, #0e1030 40%, #1a0a2e 100%);
            color: #e8e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(14, 14, 26, 0.8);
            border-bottom: 1px solid rgba(42, 42, 66, 0.5);
            -webkit-app-region: drag;
        }

        .header-icon {
            font-size: 22px;
            margin-right: 10px;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-badge {
            margin-left: 10px;
            padding: 2px 10px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            border-radius: 10px;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo-container {
            position: relative;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 50%, #4f46e5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.3), 0 0 100px rgba(129, 140, 248, 0.1);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 20px 60px rgba(99, 102, 241, 0.3), 0 0 100px rgba(129, 140, 248, 0.1);
            }

            50% {
                box-shadow: 0 25px 80px rgba(99, 102, 241, 0.5), 0 0 140px rgba(129, 140, 248, 0.2);
            }
        }

        .logo-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 34px;
            border: 2px solid rgba(129, 140, 248, 0.15);
            animation: ringPulse 3s ease-in-out infinite;
        }

        @keyframes ringPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        /* Title */
        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #9a9ab8;
            margin-top: -20px;
        }

        /* Coming Soon Badge */
        .coming-soon {
            padding: 10px 28px;
            background: rgba(129, 140, 248, 0.1);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #818cf8;
            animation: glowBadge 2s ease-in-out infinite;
        }

        @keyframes glowBadge {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(129, 140, 248, 0.1);
            }

            50% {
                box-shadow: 0 0 40px rgba(129, 140, 248, 0.2);
            }
        }

        /* Features Preview */
        .features {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }

        .feature-card {
            padding: 16px 20px;
            background: rgba(20, 20, 40, 0.6);
            border: 1px solid rgba(42, 42, 66, 0.5);
            border-radius: 14px;
            text-align: center;
            width: 140px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            border-color: rgba(129, 140, 248, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-name {
            font-size: 11px;
            font-weight: 600;
            color: #9a9ab8;
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(129, 140, 248, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        .main {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="header-icon">📊</span>
        <span class="header-title">Horizon Presentation Studio</span>
        <span class="header-badge">Coming Soon</span>
    </div>

    <div class="particles" id="particles"></div>

    <div class="main">
        <div class="logo-container">
            <div class="logo-ring"></div>
            <div class="logo">📊</div>
        </div>
        <div class="title">Presentation Studio</div>
        <div class="subtitle">Create stunning presentations with AI assistance</div>
        <div class="coming-soon">✦ Coming Soon</div>
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">🎨</div>
                <div class="feature-name">Smart Templates</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🤖</div>
                <div class="feature-name">AI Design</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🎬</div>
                <div class="feature-name">Animations</div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
            container.appendChild(p);
        }
    </script>
</body>

</html>
