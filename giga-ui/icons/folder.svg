<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glass" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="128" cy="230" rx="80" ry="15" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Back of folder -->
  <path d="M32 70 L32 200 Q32 220 52 220 L204 220 Q224 220 224 200 L224 70 Q224 50 204 50 L130 50 L110 30 Q105 25 95 25 L52 25 Q32 25 32 45 L32 70 Z" 
        fill="url(#folderGrad)" 
        opacity="0.6"
        filter="url(#glass)"/>
  
  <!-- Front of folder with glassmorphism -->
  <path d="M28 90 L28 195 Q28 215 48 215 L208 215 Q228 215 228 195 L228 90 Q228 70 208 70 L48 70 Q28 70 28 90 Z" 
        fill="url(#folderGrad)"
        filter="url(#glow)"/>
  
  <!-- Glassmorphism overlay -->
  <path d="M28 90 L28 120 Q28 100 48 100 L130 100 Q140 100 145 95 L160 80 Q165 75 155 75 L48 75 Q28 75 28 90 Z" 
        fill="rgba(255,255,255,0.3)"/>
  
  <!-- Folder tab highlight -->
  <path d="M40 35 L95 35 Q105 35 110 42 L125 57 Q130 62 120 62 L40 62 Q30 62 30 52 L30 45 Q30 35 40 35 Z" 
        fill="rgba(255,255,255,0.25)"/>
  
  <!-- Horizon logo on folder -->
  <text x="128" y="160" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">H</text>
</svg>
