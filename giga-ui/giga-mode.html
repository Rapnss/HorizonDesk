<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Giga UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="giga-style.css">
</head>

<body>
    <!-- Desktop Icons (macOS style) -->
    <div class="desktop-icons" id="desktopIcons">
        <!-- Icons will be populated dynamically -->
    </div>

    <!-- AI Prompt Bar (Always Visible) -->
    <div class="prompt-bar" id="promptBar">
        <div class="prompt-container">
            <div class="prompt-icon">H</div>
            <input type="text" class="prompt-input" id="promptInput" placeholder="Ask Horizon anything..."
                autocomplete="off" />
            <div class="prompt-actions">
                <button class="prompt-btn" id="attachBtn" title="Attach">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                    </svg>
                </button>
                <button class="prompt-btn" id="settingsBtn" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </button>
                <button class="prompt-btn send" id="sendBtn" title="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- macOS-style Dock -->
    <div class="dock" id="dock">
        <div class="dock-container">
            <div class="dock-item" data-app="finder" data-tooltip="Finder">
                <div class="dock-icon finder">
                    <div class="finder-face"></div>
                </div>
            </div>
            <div class="dock-item" data-app="horizon" data-tooltip="Horizon Desk">
                <div class="dock-icon horizon">H</div>
                <div class="dock-indicator active"></div>
            </div>
            <div class="dock-item" data-app="terminal" data-tooltip="Terminal">
                <div class="dock-icon terminal">
                    <span>&gt;_</span>
                </div>
            </div>
            <div class="dock-item" data-app="browser" data-tooltip="Browser">
                <div class="dock-icon browser">
                    <div class="browser-colors"></div>
                </div>
            </div>
            <div class="dock-item" data-app="vscode" data-tooltip="VS Code">
                <div class="dock-icon vscode">
                    <span>⌘</span>
                </div>
            </div>

            <div class="dock-separator"></div>

            <div class="dock-item" data-app="files" data-tooltip="Files">
                <div class="dock-icon folder">
                    <div class="folder-tab"></div>
                </div>
            </div>
            <div class="dock-item" data-app="downloads" data-tooltip="Downloads">
                <div class="dock-icon downloads">↓</div>
            </div>

            <div class="dock-separator"></div>

            <!-- Mode Switcher -->
            <div class="dock-item" data-app="switch" data-tooltip="Switch to Windows Mode" id="modeSwitcher">
                <div class="dock-icon switch">
                    <div class="switch-icon">⊞</div>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Response Popup -->
    <div class="ai-popup hidden" id="aiPopup">
        <div class="popup-header">
            <span class="popup-title">Horizon AI</span>
            <button class="popup-close" id="closePopup">×</button>
        </div>
        <div class="popup-content" id="popupContent">
            <!-- AI responses appear here -->
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Giga UI Settings</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-content">
                <div class="setting-group">
                    <label>Theme</label>
                    <select id="themeSelect">
                        <option value="system">System (Auto)</option>
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Dock Position</label>
                    <select id="dockPosition">
                        <option value="bottom">Bottom</option>
                        <option value="left">Left</option>
                        <option value="right">Right</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Dock Size</label>
                    <input type="range" id="dockSize" min="40" max="80" value="56">
                </div>
                <div class="setting-group">
                    <label>Magnification</label>
                    <div class="toggle">
                        <input type="checkbox" id="magnification" checked>
                        <span class="toggle-slider"></span>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Auto-hide Dock</label>
                    <div class="toggle">
                        <input type="checkbox" id="autoHide">
                        <span class="toggle-slider"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="giga-app.js"></script>
</body>

</html>
